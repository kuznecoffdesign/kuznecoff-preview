name: Develop preview
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kuznecoffdesign/kuznecoff-site
          ref: develop
          persist-credentials: false
      - name: Prepare preview
        run: |
          test -f docs/index.html
          find docs -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -exec sed -i 's|/kuznecoff-site/|/kuznecoff-preview/|g' {} +
          touch docs/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for artifact availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages" --jq '.total_count' || echo 0)
            if [ "$count" -gt 0 ]; then exit 0; fi
            sleep 5
          done
          echo 'Pages artifact was not visible after 60 seconds' >&2
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
